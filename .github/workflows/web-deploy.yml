name: Deploy svg2gcode-web
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit hash, tag, or branch to deploy'
        required: true
        default: 'main'
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: 'true'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.1
        with:
          version: v0.21.14
      - name: Trunk build
        run: |
          cd web
          trunk build --release --public-url https://sameer.github.io/svg2gcode/
      - name: Upload to Github Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploypages.outputs.page_url }}
    runs-on: ubuntu-slim
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deploypages
        uses: actions/deploy-pages@v4
